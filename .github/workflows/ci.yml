name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Runner pin (2026-10-04): Linux jobs use ubuntu-24.04, not ubuntu-latest.
# ubuntu-latest moves to Ubuntu 26 starting 2026-10-19
# (https://github.com/actions/runner-images/issues/14748). The Release workflow
# builds the x86_64 Linux CLI natively, so the runner's glibc sets the binary's
# floor (GLIBC_2.39 today); a silent image bump would raise it for every user.
# Pinned in all four workflows for consistency. Revisit once Ubuntu 26 has a
# full setup-python matrix and we decide on the glibc floor deliberately.
#
# macOS pin (2026-10-04): CI uses macos-14 to match release.yml, so tests run
# on the same image the release binaries and wheels are built on.
#
# Toolchain pin (2026-10-05): the Rust version comes from rust-toolchain.toml at
# the repo root (1.99.0). Jobs install it with `rustup toolchain install`, which
# reads that file; the runner images ship rustup. Cache keys include the file so
# a toolchain bump starts a fresh target/ cache.

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run writ-core tests
        run: cargo test -p writ-core --all-features

      - name: Run writ-cli tests
        run: cargo test -p writ-cli

      # Wall-clock tests (finding 27, 2026-10-05): these assert time bounds, so
      # they are #[ignore]d out of the default suite and run here alone, one
      # thread, after the parallel suite. The list has one source: TIMING_TESTS
      # in bench/test-gate.sh (sprint 3, doctor-ops). This step parses that
      # array instead of keeping a copy (two steps: the parse blocks, the run
      # does not). Linux only.
      # TODO(2026-10-05, clippy-clean): non-blocking for now because shared
      # runners are noisy enough to push them over their limits. Make it
      # blocking once a few weeks of runs show it green, or once the bounds
      # are relative to a calibration run.
      # Blocking: a parse failure is a CI failure even though the run below is
      # not, so a reshaped array cannot hide behind continue-on-error.
      - name: Timing test list (from bench/test-gate.sh)
        id: timing-list
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          tests=()
          while IFS= read -r t; do tests+=("$t"); done < <(awk '
            /^TIMING_TESTS=\(/ { f = 1; next }
            f && /^\)/         { exit }
            f { gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 != "" && $0 !~ /^#/) print }
          ' bench/test-gate.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no TIMING_TESTS parsed from bench/test-gate.sh"; exit 1
          fi
          for t in "${tests[@]}"; do
            [[ "$t" =~ ^[A-Za-z0-9_:]+$ ]] || { echo "::error::unexpected TIMING_TESTS entry: $t"; exit 1; }
          done
          echo "${#tests[@]} timing tests: ${tests[*]}"
          echo "tests=${tests[*]}" >> "$GITHUB_OUTPUT"

      - name: Timing tests (serial)
        if: matrix.os == 'ubuntu-24.04'
        continue-on-error: true
        shell: bash
        env:
          TIMING_TESTS: ${{ steps.timing-list.outputs.tests }}
        run: |
          read -ra tests <<< "$TIMING_TESTS"
          cargo test -p writ-core --all-features --lib --no-fail-fast -- \
            --include-ignored --exact --test-threads=1 "${tests[@]}"

      # Store integrity gate (sprint 2, 2026-10-05). Builds the bench/context
      # fixture (7 seals, 3 specs, 2 agents, 1,000 unsealed edits) with the CLI
      # under test, then fails on any referenced-but-missing object, checked two
      # independent ways: a Python walk of .writ/ and `writ verify --all-chains`.
      # No --allow-missing on purpose: a fresh fixture must be whole. Uses the
      # debug build the tests already compiled; zstd and python3 ship on both
      # runner images (store_integrity.py shells out to zstd for tree objects).
      - name: Store integrity on bench fixture
        shell: bash
        run: |
          cargo build -p writ-cli
          command -v zstd >/dev/null || { echo "zstd CLI missing on runner"; exit 2; }
          writ_bin="$GITHUB_WORKSPACE/target/debug/writ"
          fixture="$RUNNER_TEMP/writ-bench-fixture"
          python3 bench/context/fixture.py "$fixture" --writ "$writ_bin" --force
          python3 bench/store_integrity.py "$fixture"
          python3 bench/verify_check.py "$fixture" --writ "$writ_bin"

      # writ doctor fast tier (sprint 3, doctor-ops). Builds a fresh project in
      # a temp dir (git init, writ init, one spec, one seal with --paths) with
      # the debug CLI and asserts `writ doctor --format json` exits 0 with
      # clean: true. Doctor on the writ repo's own store runs in Bri's release
      # gate, not here (.writ/ is gitignored, so CI has no store of its own).
      # A binary without `doctor --format json` (no subcommand, or the 0.3.0
      # doctor with --json only) fails with a clap usage error (exit 2); that
      # is skipped with a visible notice. Anything else that is not clean fails.
      - name: writ doctor (fast tier, fresh project)
        shell: bash
        run: |
          W="$GITHUB_WORKSPACE/target/debug/writ"
          P="$RUNNER_TEMP/writ-doctor-project"
          rm -rf "$P"; mkdir -p "$P"; cd "$P"
          unset WRIT_AGENT_ID
          git init -q -b main
          printf 'print("hi")\n' > app.py
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm base
          "$W" init -y > init.log 2>&1 || { cat init.log; exit 1; }
          "$W" spec add --id ci-doctor --title "ci doctor" --agent ci --claim
          echo 'x = 1' >> app.py
          "$W" seal -s "ci doctor seal" --agent ci --spec ci-doctor --paths app.py
          rc=0
          "$W" doctor --format json > doctor.json 2> doctor.err || rc=$?
          if [ "$rc" -eq 2 ] && grep -qE "unrecognized subcommand|unexpected argument '--format'" doctor.err; then
            echo "::notice title=writ doctor skipped::this build has no 'writ doctor --format json'"
            cat doctor.err; exit 0
          fi
          DOCTOR_RC=$rc python3 - <<'EOF'
          import json, os, sys
          rc = int(os.environ["DOCTOR_RC"])
          try:
              r = json.load(open("doctor.json"))
          except json.JSONDecodeError as e:
              print(f"::error title=writ doctor::exit {rc}, output is not JSON ({e})")
              print(open("doctor.json").read()[:2000], open("doctor.err").read()[:2000]); sys.exit(1)
          print(r["headline"])
          print(f"tier={r['tier']} checks={','.join(r['checks_run'])} "
                f"red={r['red']} yellow={r['yellow']} elapsed_ms={r['elapsed_ms']}")
          for f in r["findings"]:
              print(f"::error title=doctor {f['check']} ({f['severity']})::"
                    f"{f['message']} | fix: {f['fix_command']}")
          if rc != 0 or not r["clean"] or r["findings"]:
              print(f"::error title=writ doctor::expected exit 0 and clean on a fresh project, got exit {rc}")
              sys.exit(1)
          EOF

      # Auto seal hooks without `claude` (sprint 6, 0.4.3). The hook tests in
      # crates/writ-cli/tests/auto_seal_states.rs run in the writ-cli step above
      # once un-ignored; they and this step drive the hooks the way Claude Code
      # does, with no `claude` binary: read the writ hook commands from
      # .claude/settings.json and run each with `sh -c`, stdin = the live hook
      # JSON in crates/writ-cli/tests/fixtures/claude_hooks/ fed by hand. The
      # script's PATH is its own bin dir plus system dirs, so `claude` is never
      # reachable. Latency is printed, not enforced (debug build, shared
      # runner); the release budget is checked on the release build before a tag.
      # A build whose `init -y` installs no PostToolUse hook (before auto seal
      # lands) is skipped with a visible notice; anything else that fails, fails.
      - name: Auto seal hooks (stdin fed by hand, no claude)
        shell: bash
        run: |
          W="$GITHUB_WORKSPACE/target/debug/writ"
          P="$RUNNER_TEMP/writ-hook-probe"
          rm -rf "$P"; mkdir -p "$P"; cd "$P"
          unset WRIT_AGENT_ID
          git init -q -b main
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m base
          "$W" init -y > init.log 2>&1 || { cat init.log; exit 1; }
          if ! python3 -c 'import json,sys; h=json.load(open(".claude/settings.json")).get("hooks",{}).get("PostToolUse") or []; sys.exit(0 if any("writ" in x.get("command","") for e in h for x in e.get("hooks",[])) else 1)'; then
            echo "::notice title=auto seal skipped::this build's init -y installs no PostToolUse hook"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          LATENCY_BUDGET=0 bench/release_checks/auto_seal.sh "$W" "$RUNNER_TEMP/auto-seal-check"

      # Finding 107 (sprint 4): every crate that seals must link writ-core with
      # the bridge feature, or the seal-time check on files whose base came
      # from git (finding 106) silently does not run. Asserted on each crate's
      # own feature graph, so a standalone build cannot drift. Linux only;
      # cargo tree reads metadata, no build.
      - name: writ-core bridge feature in cli, py and mcp
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          for c in writ-cli writ-py writ-mcp; do
            if cargo tree -p "$c" -e features -i writ-core | grep -q 'writ-core feature "bridge"'; then
              echo "$c: writ-core bridge on"
            else
              echo "::error title=finding 107::$c links writ-core without the bridge feature"; exit 1
            fi
          done

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -p writ-core -p writ-cli --all-features -- -D warnings
        # TODO(2026-10-05, clippy-clean): remove once the inventory in
        # TEAM_WRIT_DOCS/docs/sprints/clippy-inventory.md is cleared. Fails today
        # with 134 errors in writ-core on stable 1.99, so writ-cli is never linted.
        # Re-measured 2026-10-05 (doctor-ops, rustc 1.99.0, sprint 3 tree):
        # `cargo clippy --workspace --all-features` = 237 warnings
        # (writ-core 131, writ-cli 94, writ-py 12, writ-mcp 0).
        # Sprint 4 (ci-and-hooks): 182 on the working tree (writ-core 82,
        # writ-cli 94, writ-py 6, writ-mcp 0) after machine fixes in the files
        # nobody else was editing (seal 2fd5ec1100bd) and in writ-py. Left:
        # judgment items (too_many_arguments, deprecated pyo3 to_object, an
        # unused agent_id in py seal), main.rs and repo.rs, and the convergence
        # analyzers' by-hand manual_strip rewrites.
        # Sprint 5 cap (session-end-and-ci, 2026-10-12): 4 on the working tree
        # (writ-core 3, writ-py 1, writ-cli 0, writ-mcp 0), 0 errors, after
        # machine fixes everywhere (ptr_arg, manual_strip, sort_by_key, matches!,
        # cargo clippy --fix) and function-level allows CC decided on
        # (too_many_arguments; deprecated MostRecent until its 0.4.3 removal;
        # manual_clamp where clamp would keep a NaN). Left, judgment:
        # repo.rs dead_code convergence_epoch/bridge_tree_hash (test-only or
        # unused), repo.rs large_enum_variant (boxing changes the type),
        # repo.rs type_complexity, writ-py deprecated pyo3 to_object (the
        # IntoPyObject migration). Clearing those four lets this step become
        # `cargo clippy --workspace --all-features -- -D warnings` without
        # continue-on-error.
        continue-on-error: true

      # PREPARED, NOT ENABLED (sprint 3, doctor-ops). Target state once the
      # count above is zero: replace the step above with this one. --workspace
      # adds writ-py and writ-mcp; writ-py's pyo3 build script needs a python3
      # on PATH, which ubuntu-24.04 and macos-14 both ship. Enable only after
      # `cargo clippy --workspace --all-features -- -D warnings` exits 0 locally
      # on the pinned 1.99.0.
      # - name: Run clippy
      #   run: cargo clippy --workspace --all-features -- -D warnings

  # TODO(bri, B.1 bench-context): uncomment once bench/bench-context.sh lands.
  # Gates context cost: default <= 32 KB, brief <= 2 KB, --budget 8192 <= 8 KB,
  # latency <= 300 ms, release binary <= 13 MB. The script must exit non-zero on
  # any budget regression. Adjust the path if B.1 settles elsewhere.
  # bench-context:
  #   name: Context Benchmark
  #   needs: rust-tests
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v5
  #
  #     - name: Install Rust toolchain (from rust-toolchain.toml)
  #       run: rustup toolchain install --no-self-update && rustc --version
  #
  #     - name: Cache cargo registry & build
  #       uses: actions/cache@v5
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
  #         restore-keys: ${{ runner.os }}-bench-cargo-
  #
  #     - name: Build release CLI
  #       run: cargo build --release -p writ-cli
  #
  #     - name: Run context benchmark and budget gate
  #       run: bash bench/bench-context.sh
  #
  #     - name: Upload benchmark results
  #       if: always()
  #       uses: actions/upload-artifact@v7
  #       with:
  #         name: bench-context
  #         path: bench/context/results/
  #         if-no-files-found: warn

  # Finding 196 (sprint 7, ruling 196): before this job no CI run compiled writ
  # for Windows; only the Release workflow did, after the tag, which is how the
  # 0.4.3 tag failed on std::os::unix (finding 185). A real MSVC check (C deps
  # included), not a test run, to keep CI time down. It is a job of this
  # workflow with no continue-on-error, so a failure here fails the CI status.
  # Runner: windows-latest, the image release.yml builds the Windows CLI and
  # wheel on, so CI checks the same toolchain and SDK the release uses.
  windows-check:
    name: Windows Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-check-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-check-

      - name: cargo check (writ-cli, writ-core, all targets)
        run: cargo check -p writ-cli -p writ-core --all-targets

  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # "-cli-" (finding 95): actions/cache never rewrites an exact-hit key,
          # so the old key would keep a target/ without the CLI and every run
          # would rebuild it. The restore prefix still matches the old entries.
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-cli-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pyyaml

      - name: Build and install writ-vcs
        working-directory: crates/writ-py
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          maturin develop --release

      # Finding 95 (sprint 4): the CLI tests (init, hooks, finish, doctor,
      # install e2e) look for target/release/writ, then target/debug, then
      # PATH, and skip when none exists. Without this step CI ran 674 and
      # skipped 302 (0.4.0); on a clean clone with the CLI built, 939 pass and
      # 16 skip. Release profile, like the local release gate. It does not
      # reuse maturin's artifacts (different flags; every crate recompiles):
      # 78 s cold on an M-series Mac, cached under the "-cli-" key after the
      # first run. The test step itself grows to several minutes. Build time
      # goes to the step summary.
      - name: Build writ CLI for the CLI tests
        shell: bash
        run: |
          start=$SECONDS
          cargo build --release -p writ-cli
          "$GITHUB_WORKSPACE/target/release/writ" --version
          echo "writ CLI build: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@writ-vcs.dev"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Run Python tests
        working-directory: crates/writ-py
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          pytest tests/ ${{ github.workspace }}/bench/test_verify_check.py ${{ github.workspace }}/bench/test_transcript_metrics.py -v
