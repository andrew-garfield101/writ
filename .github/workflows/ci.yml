  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: ${{ runner.os }}-bench-cargo-
  #
  #     - name: Build release CLI
  #       run: cargo build --release -p writ-cli
  #
  #     - name: Run context benchmark and budget gate
  #       run: bash bench/bench-context.sh
  #
