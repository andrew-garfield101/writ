  #       run: rustup toolchain install --no-self-update && rustc --version
  #
  #     - name: Cache cargo registry & build
  #       uses: actions/cache@v5
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
  #         restore-keys: ${{ runner.os }}-bench-cargo-
  #
  #     - name: Build release CLI
  #       run: cargo build --release -p writ-cli
  #
  #     - name: Run context benchmark and budget gate
  #       run: bash bench/bench-context.sh
  #
  #     - name: Upload benchmark results
  #       if: always()
  #       uses: actions/upload-artifact@v7
  #       with:
  #         name: bench-context
  #         path: bench/context/results/
  #         if-no-files-found: warn

  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pyyaml

      - name: Build and install writ-vcs
        working-directory: crates/writ-py
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          maturin develop --release

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@writ-vcs.dev"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Run Python tests
        working-directory: crates/writ-py
        run: |
          source ${{ github.workspace }}/.venv/bin/activate
          pytest tests/ ${{ github.workspace }}/bench/test_verify_check.py ${{ github.workspace }}/bench/test_transcript_metrics.py -v
