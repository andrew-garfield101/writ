name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Runner pin (2026-10-04): Linux jobs use ubuntu-24.04, not ubuntu-latest.
# ubuntu-latest moves to Ubuntu 26 starting 2026-10-19
# (https://github.com/actions/runner-images/issues/14748). The Release workflow
# builds the x86_64 Linux CLI natively, so the runner's glibc sets the binary's
# floor (GLIBC_2.39 today); a silent image bump would raise it for every user.
# Pinned in all four workflows for consistency. Revisit once Ubuntu 26 has a
# full setup-python matrix and we decide on the glibc floor deliberately.

jobs:
  build:
    name: Build mdbook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.5.2"
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build book
        working-directory: book
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
