name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download release artifacts and compute checksums
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/andrew-garfield101/writ/releases/download/v${VERSION}"

          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            echo "Downloading writ-${target}.tar.gz..."
            curl -sfL -o "writ-${target}.tar.gz" "${BASE}/writ-${target}.tar.gz"
          done

          echo "mac_arm=$(sha256sum writ-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "mac_x86=$(sha256sum writ-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_arm=$(sha256sum writ-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_x86=$(sha256sum writ-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Generate formula from template
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp packaging/homebrew/writ.rb writ.rb

          sed -i 's/version ".*"/version "'"${VERSION}"'"/' writ.rb
          sed -i 's/SHA256_MAC_ARM/${{ steps.sha.outputs.mac_arm }}/' writ.rb
          sed -i 's/SHA256_MAC_X86/${{ steps.sha.outputs.mac_x86 }}/' writ.rb
          sed -i 's/SHA256_LINUX_ARM/${{ steps.sha.outputs.linux_arm }}/' writ.rb
          sed -i 's/SHA256_LINUX_X86/${{ steps.sha.outputs.linux_x86 }}/' writ.rb

          echo "Generated formula:"
          cat writ.rb

      - name: Push to Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/andrew-garfield101/homebrew-writ.git" tap
          mkdir -p tap/Formula
          cp writ.rb tap/Formula/writ.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/writ.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "writ ${VERSION}"
          git push
