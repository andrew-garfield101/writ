[package]
name = "writ-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for writ — the AI-native version control system"

[[bin]]
name = "writ"
path = "src/main.rs"

[dependencies]
writ-core = { path = "../writ-core", features = ["bridge"] }
writ-mcp = { path = "../writ-mcp" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = "0.4.44"
colored = "3"
crossterm = "0.28"
dialoguer = "0.11"
indicatif = "0.17"
tokio = { version = "1", features = ["full"] }
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
