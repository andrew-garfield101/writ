[package]
name = "writ-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for writ — the AI-native version control system"

[features]
default = []
bridge = ["git2"]
vendored-ssl = ["git2/vendored-openssl", "openssl-sys/vendored"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
rand = "0.8"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
zstd = "0.13"
toml = "0.8"
toon-format = { version = "0.4", default-features = false }
hostname = "0.4"
dirs = "5"
git2 = { version = "0.19", optional = true }
openssl-sys = { version = "0.9", optional = true }
libgit2-sys = { version = "0.17", optional = true }
notify = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
tiktoken-rs = "0.9"
