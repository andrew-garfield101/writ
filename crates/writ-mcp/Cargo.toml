[package]
name = "writ-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for writ — native agent tool integration"

[dependencies]
# bridge (finding 107): the git-base lookup behind the seal-time survival
# check (finding 106) needs it. The shipped MCP server runs inside the CLI
# (`writ mcp-serve`) and seals by running the CLI, which already has it; this
# makes a standalone writ-mcp build (tests, embedders) match.
writ-core = { path = "../writ-core", features = ["bridge"] }
rmcp = { version = "0.16", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
