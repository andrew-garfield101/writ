scenario: config_append_three_agents
version: 1
description: >
  Three agents each add different config values to the end of a file.
  Tests EOF append pattern with N > 2 agents.
tags: [pattern-5, eof-append, three-agent, config]

setup:
  specs:
    - id: spec-a
    - id: spec-b
    - id: spec-c
  baseline:
    - path: settings.py
      content: |
        APP_NAME = "writ"
        VERSION = "0.1.0"

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: settings.py
        action: write
        content: |
          APP_NAME = "writ"
          VERSION = "0.1.0"
          DB_HOST = "localhost"

  - id: agent-b
    spec: spec-b
    changes:
      - path: settings.py
        action: write
        content: |
          APP_NAME = "writ"
          VERSION = "0.1.0"
          REDIS_URL = "redis://localhost"

  - id: agent-c
    spec: spec-c
    changes:
      - path: settings.py
        action: write
        content: |
          APP_NAME = "writ"
          VERSION = "0.1.0"
          LOG_LEVEL = "DEBUG"

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: not_degraded
    - type: file_contains
      file: settings.py
      content: APP_NAME
    - type: file_contains
      file: settings.py
      content: VERSION
    - type: file_contains
      file: settings.py
      content: DB_HOST
    - type: file_contains
      file: settings.py
      content: REDIS_URL
    - type: file_contains
      file: settings.py
      content: LOG_LEVEL
  security:
    - type: chain_valid
