scenario: deep_directory_structure
version: 1
description: >
  Two agents create files in deeply nested directories. Tests that
  the convergence engine handles directory creation and deep paths.
tags: [directory, nested, structure]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: README.md
      content: |
        # Project

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: src/backend/auth/handlers.py
        action: write
        content: |
          def login_handler():
              return {"status": "ok"}
      - path: src/backend/auth/middleware.py
        action: write
        content: |
          def auth_middleware(request):
              return request

  - id: agent-b
    spec: spec-b
    changes:
      - path: src/frontend/components/login/form.tsx
        action: write
        content: |
          export function LoginForm() {
              return <form>Login</form>;
          }
      - path: src/frontend/components/login/styles.css
        action: write
        content: |
          .login-form { padding: 1rem; }

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: file_contains
      file: src/backend/auth/handlers.py
      content: login_handler
    - type: file_contains
      file: src/frontend/components/login/form.tsx
      content: LoginForm
  security:
    - type: chain_valid
