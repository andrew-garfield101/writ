scenario: function_definition_collision
version: 1
description: >
  Two agents define a function with the same name but different implementations.
  This is a semantic conflict — the engine should escalate since both sides
  modified the same named definition.
tags: [conflict, name-collision, escalation]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: utils.py
      content: |
        def helper():
            return "original"

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: utils.py
        action: write
        content: |
          def helper():
              return "version_a"

  - id: agent-b
    spec: spec-b
    changes:
      - path: utils.py
        action: write
        content: |
          def helper():
              return "version_b"

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: has_escalations
    - type: escalated_file
      file: utils.py
  security:
    - type: chain_valid
