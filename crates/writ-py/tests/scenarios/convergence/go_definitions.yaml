scenario: go_definitions
version: 1
description: >
  Two agents add different struct definitions to a Go file.
  Tests NonOverlappingDefinitions pattern with Go syntax.
tags: [pattern-2, definitions, go, cross-language]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: models.go
      content: |
        package models

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: models.go
        action: write
        content: |
          package models

          import "time"

          type User struct {
              ID        string    `json:"id"`
              Name      string    `json:"name"`
              CreatedAt time.Time `json:"created_at"`
          }

  - id: agent-b
    spec: spec-b
    changes:
      - path: models.go
        action: write
        content: |
          package models

          import "time"

          type Product struct {
              ID    string  `json:"id"`
              Price float64 `json:"price"`
              Name  string  `json:"name"`
          }

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: all_definitions_preserved
      file: models.go
      definitions: [User, Product]
  security:
    - type: chain_valid
