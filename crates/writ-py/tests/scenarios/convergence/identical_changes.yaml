scenario: identical_changes
version: 1
description: >
  Two agents make the exact same change to a file. No conflict —
  identical content should be merged cleanly.
tags: [identical, no-conflict]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: shared.py
      content: |
        original

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: shared.py
        action: write
        content: |
          identical change

  - id: agent-b
    spec: spec-b
    changes:
      - path: shared.py
        action: write
        content: |
          identical change

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: file_contains
      file: shared.py
      content: identical change
  security:
    - type: chain_valid
