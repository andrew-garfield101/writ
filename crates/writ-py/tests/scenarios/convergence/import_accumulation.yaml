scenario: import_accumulation
version: 1
description: >
  Two agents add different imports to the same file.
  Pattern 1 (ImportAccumulation) should merge imports without duplication.
tags: [pattern-1, imports, python]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: app.py
      content: |
        import os

        def main():
            pass

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: app.py
        action: write
        content: |
          import os
          import sys

          def main():
              pass

  - id: agent-b
    spec: spec-b
    changes:
      - path: app.py
        action: write
        content: |
          import os
          import json

          def main():
              pass

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: file_contains
      file: app.py
      content: "import sys"
    - type: file_contains
      file: app.py
      content: "import json"
    - type: file_contains
      file: app.py
      content: "import os"
  security:
    - type: chain_valid
