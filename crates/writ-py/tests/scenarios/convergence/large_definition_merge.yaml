scenario: large_definition_merge
version: 1
description: >
  Two agents add large, complex class definitions to the same file.
  Tests that NonOverlappingDefinitions handles real-world class sizes.
tags: [pattern-2, definitions, large, realistic]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: services.py
      content: |
        # Service layer

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: services.py
        action: write
        content: |
          from typing import Optional
          from dataclasses import dataclass, field

          @dataclass
          class AuthService:
              """Handles user authentication and session management."""
              secret_key: str
              token_ttl: int = 3600
              max_attempts: int = 5
              _sessions: dict = field(default_factory=dict)

              def authenticate(self, username: str, password: str) -> Optional[str]:
                  """Authenticate a user and return a session token."""
                  if self._check_credentials(username, password):
                      return self._create_session(username)
                  return None

              def _check_credentials(self, username: str, password: str) -> bool:
                  return len(password) >= 8

              def _create_session(self, username: str) -> str:
                  import uuid
                  token = str(uuid.uuid4())
                  self._sessions[token] = username
                  return token

              def validate_session(self, token: str) -> bool:
                  return token in self._sessions

  - id: agent-b
    spec: spec-b
    changes:
      - path: services.py
        action: write
        content: |
          from typing import Optional, List
          from dataclasses import dataclass, field

          @dataclass
          class NotificationService:
              """Handles sending notifications via various channels."""
              smtp_host: str
              smtp_port: int = 587
              max_retries: int = 3
              _queue: list = field(default_factory=list)

              def send_email(self, to: str, subject: str, body: str) -> bool:
                  """Send an email notification."""
                  self._queue.append({
                      "type": "email",
                      "to": to,
                      "subject": subject,
                      "body": body,
                  })
                  return self._flush_queue()

              def send_sms(self, phone: str, message: str) -> bool:
                  """Send an SMS notification."""
                  self._queue.append({
                      "type": "sms",
                      "phone": phone,
                      "message": message,
                  })
                  return self._flush_queue()

              def _flush_queue(self) -> bool:
                  # Process queued notifications
                  self._queue.clear()
                  return True

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: all_definitions_preserved
      file: services.py
      definitions: [AuthService, NotificationService]
    - type: file_contains
      file: services.py
      content: authenticate
    - type: file_contains
      file: services.py
      content: send_email
  verification:
    - type: syntax_valid
      file: services.py
  security:
    - type: chain_valid
