scenario: mixed_new_and_modified
version: 1
description: >
  One agent modifies an existing file and creates a new one.
  Another agent only creates a new file. Tests mixed operation convergence.
tags: [mixed-ops, new-files]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: existing.py
      content: |
        # original

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: existing.py
        action: write
        content: |
          # modified by A
      - path: new_a.py
        action: write
        content: |
          # new file from A

  - id: agent-b
    spec: spec-b
    changes:
      - path: new_b.py
        action: write
        content: |
          # new file from B

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: file_contains
      file: new_a.py
      content: new file from A
    - type: file_contains
      file: new_b.py
      content: new file from B
  security:
    - type: chain_valid
