scenario: non_overlapping_definitions
version: 1
description: >
  Two agents add different class definitions to the same file.
  Pattern 2 (NonOverlappingDefinitions) should compose all classes.
  Regression test for TR19 pattern.
origin: TR19 (Sprint 14)
tags: [pattern-2, definitions, regression, python]

setup:
  specs:
    - id: inventory
      file_scope: ["models.py"]
    - id: auth
      file_scope: ["models.py"]
  baseline:
    - path: models.py
      content: |
        class BaseModel:
            pass

agents:
  - id: inventory-dev
    spec: inventory
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class Product:
              name: str
              price: float

          @dataclass
          class Inventory:
              products: list

  - id: auth-dev
    spec: auth
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class User:
              username: str
              email: str

          @dataclass
          class Session:
              user_id: str
              token: str

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: all_definitions_preserved
      file: models.py
      definitions: [Product, Inventory, User, Session]
  verification:
    - type: syntax_valid
      file: models.py
  security:
    - type: chain_valid
