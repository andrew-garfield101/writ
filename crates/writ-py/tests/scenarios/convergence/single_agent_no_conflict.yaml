scenario: single_agent_no_conflict
version: 1
description: >
  Only one agent makes changes. Convergence should be trivially clean.
  This is the degenerate case — validates the merge handles single branches.
tags: [edge-case, single-agent, trivial]

setup:
  specs:
    - id: spec-a
  baseline:
    - path: base.py
      content: |
        # base

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: base.py
        action: write
        content: |
          # modified
          def feature():
              return True

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: is_clean
      expected: true
    - type: not_degraded
  security:
    - type: chain_valid
