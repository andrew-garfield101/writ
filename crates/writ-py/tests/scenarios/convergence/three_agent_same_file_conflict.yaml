scenario: three_agent_same_file_conflict
version: 1
description: >
  Three agents all modify the same line in a shared file.
  Tests N-way conflict escalation behavior.
tags: [conflict, three-agent, escalation]

setup:
  specs:
    - id: spec-a
    - id: spec-b
    - id: spec-c
  baseline:
    - path: shared.py
      content: |
        line1
        original_value
        line3

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: shared.py
        action: write
        content: |
          line1
          value_from_agent_a
          line3

  - id: agent-b
    spec: spec-b
    changes:
      - path: shared.py
        action: write
        content: |
          line1
          value_from_agent_b
          line3

  - id: agent-c
    spec: spec-c
    changes:
      - path: shared.py
        action: write
        content: |
          line1
          value_from_agent_c
          line3

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: has_escalations
    - type: escalated_file
      file: shared.py
  security:
    - type: chain_valid
