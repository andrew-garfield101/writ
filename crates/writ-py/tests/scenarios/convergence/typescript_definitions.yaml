scenario: typescript_definitions
version: 1
description: >
  Two agents add different interface definitions to a TypeScript file.
  Tests NonOverlappingDefinitions pattern with TypeScript syntax.
tags: [pattern-2, definitions, typescript, cross-language]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: types.ts
      content: |
        // API types

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: types.ts
        action: write
        content: |
          export interface User {
            id: string;
            name: string;
            email: string;
          }

          export interface AuthToken {
            token: string;
            expiresAt: number;
          }

  - id: agent-b
    spec: spec-b
    changes:
      - path: types.ts
        action: write
        content: |
          export interface Product {
            id: string;
            title: string;
            price: number;
          }

          export interface Cart {
            items: Product[];
            total: number;
          }

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: all_definitions_preserved
      file: types.ts
      definitions: [User, AuthToken, Product, Cart]
  security:
    - type: chain_valid
