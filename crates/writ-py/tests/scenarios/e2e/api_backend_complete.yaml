scenario: api_backend_complete
version: 1
description: >
  Realistic E2E: two backend agents build different API modules.
  Agent A builds user auth, Agent B builds product catalog.
  Both add models, routes, and shared config — exercising multiple
  convergence patterns across multiple files simultaneously.
origin: Realistic multi-module API scenario
tags: [e2e, realistic, multi-module, api]

setup:
  specs:
    - id: user-auth
      file_scope: ["models.py", "routes/auth.py", "config.py"]
    - id: product-catalog
      file_scope: ["models.py", "routes/products.py", "config.py"]

  baseline:
    - path: models.py
      content: |
        # Application models
    - path: config.py
      content: |
        APP_NAME = "api"
        PORT = 8000

agents:
  - id: auth-agent
    spec: user-auth
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class User:
              id: str
              username: str
              password_hash: str

          @dataclass
          class Token:
              user_id: str
              access_token: str
              refresh_token: str

      - path: routes/auth.py
        action: write
        content: |
          def login(username, password):
              """Authenticate user and return tokens."""
              return {"access_token": "xxx", "refresh_token": "yyy"}

          def refresh(refresh_token):
              """Refresh an access token."""
              return {"access_token": "new_xxx"}

      - path: config.py
        action: write
        content: |
          APP_NAME = "api"
          PORT = 8000
          JWT_SECRET = "dev-secret"
          TOKEN_TTL = 3600

  - id: catalog-agent
    spec: product-catalog
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class Product:
              id: str
              name: str
              price: float
              category: str

          @dataclass
          class Category:
              id: str
              name: str
              parent_id: str

      - path: routes/products.py
        action: write
        content: |
          def list_products(category=None):
              """List all products, optionally filtered by category."""
              return []

          def get_product(product_id):
              """Get a single product by ID."""
              return None

      - path: config.py
        action: write
        content: |
          APP_NAME = "api"
          PORT = 8000
          CATALOG_PAGE_SIZE = 50
          SEARCH_ENABLED = True

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: not_degraded
    # models.py: non-overlapping definitions from both agents
    - type: all_definitions_preserved
      file: models.py
      definitions: [User, Token, Product, Category]
    # Route files are disjoint
    - type: file_contains
      file: routes/auth.py
      content: login
    - type: file_contains
      file: routes/products.py
      content: list_products
    # Config: both append different values
    - type: file_contains
      file: config.py
      content: APP_NAME

  verification:
    - type: syntax_valid
      file: models.py
    - type: syntax_valid
      file: routes/auth.py
    - type: syntax_valid
      file: routes/products.py

  security:
    - type: chain_valid
    - type: chain_no_failures
    - type: seal_has_content_hash
