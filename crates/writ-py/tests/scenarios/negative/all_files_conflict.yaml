# Negative test: Every file has line-level conflicts that can't be auto-composed.
# Expected: escalations on files with incompatible edits, is_clean=false.
scenario: all_files_conflict
version: 1
description: >
  Two agents modify every file with incompatible line-level changes
  (different constant values, different return strings). Tests that
  the engine escalates files with no matching composition pattern.
tags: [negative, conflict, escalation]

setup:
  specs:
    - id: feat-x
    - id: feat-y
  baseline:
    - path: config.py
      content: |
        DEBUG = False
        PORT = 8080
    - path: routes.py
      content: |
        def index():
            return "hello"
    - path: models.py
      content: |
        class User:
            name = ""

agents:
  - id: agent-x
    spec: feat-x
    changes:
      - path: config.py
        action: write
        content: |
          DEBUG = True
          PORT = 3000
          LOG_LEVEL = "verbose"
      - path: routes.py
        action: write
        content: |
          def index():
              return "welcome to v2"
      - path: models.py
        action: write
        content: |
          class User:
              name = ""
              email = ""
  - id: agent-y
    spec: feat-y
    changes:
      - path: config.py
        action: write
        content: |
          DEBUG = False
          PORT = 9090
          WORKERS = 4
      - path: routes.py
        action: write
        content: |
          def index():
              return "hello world!"
      - path: models.py
        action: write
        content: |
          class User:
              name = ""
              age = 0

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: has_escalations
    - type: is_clean
      expected: false
    # config.py and routes.py have incompatible line edits → escalated
    - type: escalated_file
      file: config.py
    - type: escalated_file
      file: routes.py
  security:
    - type: chain_valid
