# Negative test: Both agents completely rewrite the same file with no common lines.
# This is the worst-case: no common structure for the engine to anchor on.
# Expected: conflict detected, likely escalation since lines are incompatible.
scenario: both_rewrite_entire_file
version: 1
description: >
  Both agents completely replace the contents of the same file
  with entirely different frameworks (Flask vs FastAPI). No shared
  lines remain. Tests worst-case merge scenario.
tags: [negative, conflict, rewrite, escalation]

setup:
  specs:
    - id: feat-v2
    - id: feat-v3
  baseline:
    - path: app.py
      content: |
        # v1 app
        def main():
            print("v1")

agents:
  - id: agent-v2
    spec: feat-v2
    changes:
      - path: app.py
        action: write
        content: |
          # v2 app
          from flask import Flask
          app = Flask(__name__)

          @app.route("/")
          def home():
              return "v2"
  - id: agent-v3
    spec: feat-v3
    changes:
      - path: app.py
        action: write
        content: |
          # v3 app
          from fastapi import FastAPI
          app = FastAPI()

          @app.get("/")
          async def home():
              return {"version": "v3"}

convergence:
  strategy: escalate

assertions:
  convergence:
    # Full rewrite conflict must be detected
    - type: total_conflicts
      expected: 1
    # File should still exist
    - type: file_exists
      file: app.py
  security:
    - type: chain_valid
