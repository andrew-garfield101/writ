# Negative test: Two agents edit the same function lines differently.
# The engine detects conflicts but may auto-resolve via concatenation.
# We verify: conflicts detected, total_conflicts > 0.
scenario: incompatible_function_edits
version: 1
description: >
  Two agents modify the same function body in different ways.
  Convergence should detect conflicts (even if auto-resolved).
tags: [negative, conflict]

setup:
  specs:
    - id: feat-a
    - id: feat-b
  baseline:
    - path: calculator.py
      content: |
        def add(a, b):
            return a + b

        def multiply(a, b):
            return a * b

agents:
  - id: agent-a
    spec: feat-a
    changes:
      - path: calculator.py
        action: write
        content: |
          def add(a, b):
              """Add two numbers with logging."""
              print(f"Adding {a} + {b}")
              return a + b

          def multiply(a, b):
              return a * b
  - id: agent-b
    spec: feat-b
    changes:
      - path: calculator.py
        action: write
        content: |
          def add(a, b):
              """Add numbers with validation."""
              if not isinstance(a, (int, float)):
                  raise TypeError("a must be numeric")
              return a + b

          def multiply(a, b):
              return a * b

convergence:
  strategy: escalate

assertions:
  convergence:
    # Both agents changed the same file — conflict must be detected
    - type: total_conflicts
      expected: 1
    # The merged result should still contain the multiply function
    - type: file_contains
      file: calculator.py
      content: "def multiply"
  security:
    - type: chain_valid
