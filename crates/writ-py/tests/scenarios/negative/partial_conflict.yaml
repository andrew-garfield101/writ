# Negative test: Mix of clean merges and conflicts in the same convergence.
# Disjoint files merge cleanly; shared file with incompatible edits conflicts.
scenario: partial_conflict
version: 1
description: >
  Two agents each have disjoint files that merge cleanly, plus one
  shared file they both edit with incompatible constant values.
  Tests that convergence correctly reports partial success.
tags: [negative, conflict, partial]

setup:
  specs:
    - id: feat-auth
    - id: feat-api
  baseline:
    - path: auth.py
      content: |
        def login(user, password):
            return True
    - path: routes.py
      content: |
        def index():
            return "ok"
    - path: shared_config.py
      content: |
        TIMEOUT = 30
        RETRIES = 3

agents:
  - id: agent-auth
    spec: feat-auth
    changes:
      # Disjoint: only agent-auth touches auth.py
      - path: auth.py
        action: write
        content: |
          import hashlib

          def login(user, password):
              hashed = hashlib.sha256(password.encode()).hexdigest()
              return verify(user, hashed)

          def verify(user, hashed_pw):
              return True  # stub
      # Conflict: both agents change TIMEOUT to different values
      - path: shared_config.py
        action: write
        content: |
          TIMEOUT = 60
          RETRIES = 5
          AUTH_CACHE_TTL = 300
  - id: agent-api
    spec: feat-api
    changes:
      # Disjoint: only agent-api touches routes.py
      - path: routes.py
        action: write
        content: |
          def index():
              return "ok"

          def health():
              return {"status": "healthy"}
      # Conflict: both agents change TIMEOUT to different values
      - path: shared_config.py
        action: write
        content: |
          TIMEOUT = 10
          RETRIES = 3
          MAX_CONNECTIONS = 100

convergence:
  strategy: escalate

assertions:
  convergence:
    # shared_config.py has incompatible constant edits → escalation
    - type: has_escalations
    - type: escalated_file
      file: shared_config.py
    - type: is_clean
      expected: false
  security:
    - type: chain_valid
