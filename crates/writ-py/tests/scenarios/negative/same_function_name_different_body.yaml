# Negative test: Both agents add a function with the same name but different bodies.
# The engine detects a conflict on the shared file.
scenario: same_function_name_different_body
version: 1
description: >
  Both agents add a function called 'process' with completely
  different implementations to the same file. Tests that
  convergence detects this as a conflict.
tags: [negative, definitions, conflict]

setup:
  specs:
    - id: feat-csv
    - id: feat-json
  baseline:
    - path: processor.py
      content: |
        """Data processor module."""

agents:
  - id: agent-csv
    spec: feat-csv
    changes:
      - path: processor.py
        action: write
        content: |
          """Data processor module."""
          import csv

          def process(data):
              """Process CSV data."""
              reader = csv.reader(data.splitlines())
              return [row for row in reader]
  - id: agent-json
    spec: feat-json
    changes:
      - path: processor.py
        action: write
        content: |
          """Data processor module."""
          import json

          def process(data):
              """Process JSON data."""
              return json.loads(data)

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: total_conflicts
      expected: 1
    # The docstring from baseline should survive
    - type: file_contains
      file: processor.py
      content: "Data processor module"
  security:
    - type: chain_valid
