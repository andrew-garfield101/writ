# Negative test: Three agents all change the same constant to different values.
# This forces a true three-way conflict that can't be auto-composed.
scenario: three_way_conflict
version: 1
description: >
  Three agents all modify the same constant line to incompatible values.
  The engine merges pairwise — each merge step encounters irreconcilable
  line-level edits. Tests multi-agent escalation behavior.
tags: [negative, conflict, multi-agent, escalation]

setup:
  specs:
    - id: feat-dev
    - id: feat-staging
    - id: feat-prod
  baseline:
    - path: settings.py
      content: |
        ENV = "local"
        PORT = 8000
        DEBUG = True

agents:
  - id: agent-dev
    spec: feat-dev
    changes:
      - path: settings.py
        action: write
        content: |
          ENV = "development"
          PORT = 3000
          DEBUG = True
  - id: agent-staging
    spec: feat-staging
    changes:
      - path: settings.py
        action: write
        content: |
          ENV = "staging"
          PORT = 8080
          DEBUG = False
  - id: agent-prod
    spec: feat-prod
    changes:
      - path: settings.py
        action: write
        content: |
          ENV = "production"
          PORT = 443
          DEBUG = False

convergence:
  strategy: escalate

assertions:
  convergence:
    # All three changed the same lines → escalation expected
    - type: has_escalations
    - type: escalated_file
      file: settings.py
    - type: is_clean
      expected: false
  security:
    - type: chain_valid
