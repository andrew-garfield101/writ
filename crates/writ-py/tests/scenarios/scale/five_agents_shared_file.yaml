scenario: five_agents_shared_file
version: 1
description: >
  Five agents all add different classes to the same models file.
  Tests NonOverlappingDefinitions at scale with many contributors.
tags: [scale, five-agent, definitions, shared-file]

setup:
  specs:
    - id: spec-a
    - id: spec-b
    - id: spec-c
    - id: spec-d
    - id: spec-e
  baseline:
    - path: models.py
      content: |
        # Domain models

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class User:
              name: str
              email: str

  - id: agent-b
    spec: spec-b
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class Product:
              title: str
              price: float

  - id: agent-c
    spec: spec-c
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class Order:
              user_id: str
              total: float

  - id: agent-d
    spec: spec-d
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class Invoice:
              order_id: str
              amount: float

  - id: agent-e
    spec: spec-e
    changes:
      - path: models.py
        action: write
        content: |
          from dataclasses import dataclass

          @dataclass
          class Payment:
              invoice_id: str
              method: str

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: not_degraded
    - type: all_definitions_preserved
      file: models.py
      definitions: [User, Product, Order, Invoice, Payment]
  verification:
    - type: syntax_valid
      file: models.py
  security:
    - type: chain_valid
