# Performance baseline: 10 agents, disjoint files.
# Establishes timing thresholds for regression detection.
# If this fails, convergence performance has regressed.
scenario: perf_10_agents_baseline
version: 1
description: >
  Performance baseline: 10 agents working on disjoint files.
  This is the simplest N-agent case (no conflicts, no shared files).
  Threshold: total under 2 seconds, convergence under 1 second.
tags: [scale, performance, baseline]

setup:
  specs:
    - id: spec-0
    - id: spec-1
    - id: spec-2
    - id: spec-3
    - id: spec-4
    - id: spec-5
    - id: spec-6
    - id: spec-7
    - id: spec-8
    - id: spec-9
  baseline:
    - path: modules/mod_0.py
      content: "def base_0():\n    return 0\n"
    - path: modules/mod_1.py
      content: "def base_1():\n    return 1\n"
    - path: modules/mod_2.py
      content: "def base_2():\n    return 2\n"
    - path: modules/mod_3.py
      content: "def base_3():\n    return 3\n"
    - path: modules/mod_4.py
      content: "def base_4():\n    return 4\n"
    - path: modules/mod_5.py
      content: "def base_5():\n    return 5\n"
    - path: modules/mod_6.py
      content: "def base_6():\n    return 6\n"
    - path: modules/mod_7.py
      content: "def base_7():\n    return 7\n"
    - path: modules/mod_8.py
      content: "def base_8():\n    return 8\n"
    - path: modules/mod_9.py
      content: "def base_9():\n    return 9\n"

agents:
  - id: agent-0
    spec: spec-0
    changes:
      - path: modules/mod_0.py
        action: write
        content: "def base_0():\n    return 0\n\ndef feat_0():\n    return 'agent-0'\n"
  - id: agent-1
    spec: spec-1
    changes:
      - path: modules/mod_1.py
        action: write
        content: "def base_1():\n    return 1\n\ndef feat_1():\n    return 'agent-1'\n"
  - id: agent-2
    spec: spec-2
    changes:
      - path: modules/mod_2.py
        action: write
        content: "def base_2():\n    return 2\n\ndef feat_2():\n    return 'agent-2'\n"
  - id: agent-3
    spec: spec-3
    changes:
      - path: modules/mod_3.py
        action: write
        content: "def base_3():\n    return 3\n\ndef feat_3():\n    return 'agent-3'\n"
  - id: agent-4
    spec: spec-4
    changes:
      - path: modules/mod_4.py
        action: write
        content: "def base_4():\n    return 4\n\ndef feat_4():\n    return 'agent-4'\n"
  - id: agent-5
    spec: spec-5
    changes:
      - path: modules/mod_5.py
        action: write
        content: "def base_5():\n    return 5\n\ndef feat_5():\n    return 'agent-5'\n"
  - id: agent-6
    spec: spec-6
    changes:
      - path: modules/mod_6.py
        action: write
        content: "def base_6():\n    return 6\n\ndef feat_6():\n    return 'agent-6'\n"
  - id: agent-7
    spec: spec-7
    changes:
      - path: modules/mod_7.py
        action: write
        content: "def base_7():\n    return 7\n\ndef feat_7():\n    return 'agent-7'\n"
  - id: agent-8
    spec: spec-8
    changes:
      - path: modules/mod_8.py
        action: write
        content: "def base_8():\n    return 8\n\ndef feat_8():\n    return 'agent-8'\n"
  - id: agent-9
    spec: spec-9
    changes:
      - path: modules/mod_9.py
        action: write
        content: "def base_9():\n    return 9\n\ndef feat_9():\n    return 'agent-9'\n"

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: not_degraded
    - type: no_escalations
    - type: file_contains
      file: modules/mod_0.py
      content: feat_0
    - type: file_contains
      file: modules/mod_9.py
      content: feat_9
  security:
    - type: chain_valid
  performance:
    - type: max_duration
      seconds: 2.0
    - type: max_convergence_duration
      seconds: 1.0
