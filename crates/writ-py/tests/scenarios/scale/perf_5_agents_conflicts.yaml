# Performance benchmark: 5 agents, all modifying a shared file.
# Tests convergence speed when conflicts require resolution.
scenario: perf_5_agents_conflicts
version: 1
description: >
  Performance benchmark: 5 agents all modify the same file with
  different constant values, forcing conflict resolution on each merge step.
  Threshold: total under 1.5 seconds.
tags: [scale, performance, conflict]

setup:
  specs:
    - id: spec-0
    - id: spec-1
    - id: spec-2
    - id: spec-3
    - id: spec-4
  baseline:
    - path: config.py
      content: |
        APP_NAME = "myapp"
        VERSION = "1.0"
        PORT = 8000

agents:
  - id: agent-0
    spec: spec-0
    changes:
      - path: config.py
        action: write
        content: |
          APP_NAME = "myapp"
          VERSION = "1.0"
          PORT = 3000
      - path: feature_0.py
        action: write
        content: |
          def feature_0():
              return "agent-0"
  - id: agent-1
    spec: spec-1
    changes:
      - path: config.py
        action: write
        content: |
          APP_NAME = "myapp"
          VERSION = "1.0"
          PORT = 3001
      - path: feature_1.py
        action: write
        content: |
          def feature_1():
              return "agent-1"
  - id: agent-2
    spec: spec-2
    changes:
      - path: config.py
        action: write
        content: |
          APP_NAME = "myapp"
          VERSION = "1.0"
          PORT = 3002
      - path: feature_2.py
        action: write
        content: |
          def feature_2():
              return "agent-2"
  - id: agent-3
    spec: spec-3
    changes:
      - path: config.py
        action: write
        content: |
          APP_NAME = "myapp"
          VERSION = "1.0"
          PORT = 3003
      - path: feature_3.py
        action: write
        content: |
          def feature_3():
              return "agent-3"
  - id: agent-4
    spec: spec-4
    changes:
      - path: config.py
        action: write
        content: |
          APP_NAME = "myapp"
          VERSION = "1.0"
          PORT = 3004
      - path: feature_4.py
        action: write
        content: |
          def feature_4():
              return "agent-4"

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: not_degraded
    # Disjoint feature files should merge cleanly
    - type: file_exists
      file: feature_0.py
    - type: file_exists
      file: feature_4.py
  security:
    - type: chain_valid
  performance:
    - type: max_duration
      seconds: 1.5
    - type: max_convergence_duration
      seconds: 0.5
