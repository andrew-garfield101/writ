scenario: chain_integrity
version: 1
description: >
  Multiple agents seal work and then convergence runs. The full seal chain
  should remain valid with all hashes intact.
tags: [security, chain, integrity]

setup:
  specs:
    - id: spec-a
    - id: spec-b
  baseline:
    - path: app.py
      content: |
        # app

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: feature_a.py
        action: write
        content: |
          def feature_a():
              return True

  - id: agent-b
    spec: spec-b
    changes:
      - path: feature_b.py
        action: write
        content: |
          def feature_b():
              return True

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
  security:
    - type: chain_valid
    - type: chain_no_failures
    - type: seal_has_content_hash
    - type: seal_has_chain_hash
