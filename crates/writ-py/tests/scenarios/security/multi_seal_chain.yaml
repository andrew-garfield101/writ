scenario: multi_seal_chain
version: 1
description: >
  Five agents seal disjoint work. Verifies that a longer chain with
  multiple seals maintains cryptographic integrity throughout.
tags: [security, chain, multi-seal]

setup:
  specs:
    - id: spec-a
    - id: spec-b
    - id: spec-c
    - id: spec-d
    - id: spec-e
  baseline:
    - path: base.py
      content: |
        # base

agents:
  - id: agent-a
    spec: spec-a
    changes:
      - path: a.py
        action: write
        content: |
          def a(): pass
  - id: agent-b
    spec: spec-b
    changes:
      - path: b.py
        action: write
        content: |
          def b(): pass
  - id: agent-c
    spec: spec-c
    changes:
      - path: c.py
        action: write
        content: |
          def c(): pass
  - id: agent-d
    spec: spec-d
    changes:
      - path: d.py
        action: write
        content: |
          def d(): pass
  - id: agent-e
    spec: spec-e
    changes:
      - path: e.py
        action: write
        content: |
          def e(): pass

convergence:
  strategy: escalate

assertions:
  convergence:
    - type: no_escalations
    - type: is_clean
      expected: true
  security:
    - type: chain_valid
    - type: chain_no_failures
    - type: seal_has_content_hash
    - type: seal_has_chain_hash
