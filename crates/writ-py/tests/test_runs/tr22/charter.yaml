tr: 22
date: 2026-02-26
title: "Security-Aware Convergence — Task Management App"
sprint: Security Sprint C

objective: >
  Validate that multi-agent convergence works correctly on a task management
  app with three agents (backend, frontend, rogue). Tests convergence quality,
  seal chain integrity, metadata consistency, and that scope warnings fire
  when an agent works outside its declared file scope.

what_we_are_testing:
  - Multi-agent convergence (3 agents, mixed overlap on models + app files)
  - Seal chain integrity after convergence
  - Post-convergence metadata consistency
  - Scope warning when rogue-agent touches files outside its declared scope
  - Python code quality after merge (syntax, imports, brackets)

what_pass_looks_like:
  - All agent seals complete successfully
  - Convergence merges without degradation
  - Seal chain is valid with no failures
  - All seals have content_hash and chain_hash
  - Post-convergence state is clean (no diverged branches, convergence not recommended)
  - All Python files have valid syntax after merge
  - All expected definitions preserved in merged files
  - Rogue agent's out-of-scope work gets a scope warning (not hard rejection)

what_fail_looks_like:
  - Convergence crashes or produces silent data loss
  - Seal chain integrity check fails
  - Missing crypto hashes on seals
  - Post-convergence state still shows diverged branches
  - Python syntax errors in merged files
  - Agent definitions silently dropped during merge

domain: "Task management app"
estimated_duration: "30 seconds (scripted) / 20-30 minutes (live)"

agents:
  - name: backend-dev
    spec: backend
    title: "Backend API & Models"
    file_scope: ["api/*.py"]

  - name: frontend-dev
    spec: frontend
    title: "Frontend UI Components"
    file_scope: ["web/src/*"]

  - name: rogue-agent
    spec: rogue
    title: "Rogue Agent (out-of-scope testing)"
    file_scope: ["web/src/*"]

convergence:
  strategy: escalate

checks:
  convergence:
    - type: not_degraded
    # models.py: backend adds Project + Comment, should compose with baseline Task + User
    - type: definitions_preserved
      file: api/models.py
      definitions: [Task, User, Project, Comment]
    # app.py: backend adds CRUD routes
    - type: file_contains
      file: api/app.py
      content: "/tasks"
    # App.tsx: frontend adds TaskList
    - type: file_contains
      file: web/src/App.tsx
      content: TaskList
    # api.ts: frontend adds fetchTasks
    - type: file_contains
      file: web/src/api.ts
      content: fetchTasks
    # Expected files exist
    - type: file_exists
      file: api/models.py
    - type: file_exists
      file: web/src/App.tsx
    - type: file_exists
      file: web/src/components/TaskList.tsx

  security:
    - type: chain_valid
    - type: chain_no_failures
    - type: seals_have_hashes

  metadata:
    - type: post_convergence_clean
    - type: spec_exists
      spec_id: backend
    - type: spec_exists
      spec_id: frontend
    - type: spec_exists
      spec_id: rogue

  quality:
    - type: python_syntax
      file: api/app.py
    - type: python_syntax
      file: api/models.py
    - type: python_syntax
      file: api/auth.py
    - type: no_duplicate_imports
      file: api/app.py
    - type: bracket_balance
      file: api/app.py
